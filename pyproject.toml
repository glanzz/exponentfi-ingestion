[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "ledger"
version = "0.1.0"
description = "Categorize a restaurant operator's transaction feed into ledger lines (EXP-412, Story 1)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17",
    "hypothesis>=6.0",
]

[project.scripts]
ledger = "ledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# UP042: we deliberately inherit from (str, Enum) so enum values serialize to
# the CSV as their literal string value. StrEnum changes that behavior, so this
# is intentional, not a defect.
ignore = ["UP042"]
